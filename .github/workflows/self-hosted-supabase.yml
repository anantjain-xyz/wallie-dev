name: Self-hosted Supabase

on:
  push:
    branches: [main]
    paths:
      - "infra/supabase/**"
      - "supabase/**"
      - "scripts/check-self-hosted-supabase.mjs"
      - "scripts/fixtures/self-hosted-supabase-probe.mjs"
      - "scripts/fixtures/qualification-tap.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/self-hosted-supabase.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/supabase/**"
      - "supabase/**"
      - "scripts/check-self-hosted-supabase.mjs"
      - "scripts/fixtures/self-hosted-supabase-probe.mjs"
      - "scripts/fixtures/qualification-tap.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/self-hosted-supabase.yml"

permissions:
  contents: read

jobs:
  self-hosted-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Qualify the pinned upstream stack
        run: node scripts/check-self-hosted-supabase.mjs
