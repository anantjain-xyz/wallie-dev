name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full validation
        run: pnpm check

      # pgTAP is not run in CI yet. `supabase test db` needs Docker, the
      # Supabase CLI, and a running local stack (`supabase start`, 1-3 minutes).
      # This workflow does not install the CLI or start Supabase, and adding a
      # failing step would break the validation-contract exact shape.
      # When that environment is ready, add:
      #   - name: Start local Supabase
      #     run: SUPABASE_TELEMETRY_DISABLED=1 supabase start
      #   - name: Run pgTAP database tests
      #     run: pnpm check:db-tests
      # Until then, run `pnpm check:db-tests` locally after `supabase start`.
      # See docs/VERIFICATION.md.

  route-budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production route diagnostics
        run: pnpm build

      - name: Enforce route bundle ceilings
        run: pnpm check:route-budgets
