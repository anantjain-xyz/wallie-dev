name: AWS PostgreSQL backup destination

on:
  push:
    branches: [main]
    paths:
      - "infra/aws/staging-backup/**"
      - ".github/workflows/aws-backup.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/aws/staging-backup/**"
      - ".github/workflows/aws-backup.yml"

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - name: Check formatting
        run: terraform -chdir=infra/aws/staging-backup fmt -check -recursive
      - name: Initialize pinned provider without the AWS backend
        run: terraform -chdir=infra/aws/staging-backup init -backend=false -lockfile=readonly -input=false
      - name: Validate configuration
        run: terraform -chdir=infra/aws/staging-backup validate
      - name: Run mocked safety tests without AWS credentials
        run: terraform -chdir=infra/aws/staging-backup test
