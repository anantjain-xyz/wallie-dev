AWSTemplateFormatVersion: "2010-09-09"
Description: Retained private storage for Wallie staging Terraform state.

Resources:
  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: wallie-staging-tfstate-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: Wallie
        - Key: Environment
          Value: staging
        - Key: Purpose
          Value: terraform-state

  StateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket:
        Ref: StateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RequireTLS
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - Fn::GetAtt: [StateBucket, Arn]
              - Fn::Sub: ${StateBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  StateBucketName:
    Description: Bucket for the staging Terraform S3 backend.
    Value:
      Ref: StateBucket
  StateRegion:
    Value:
      Ref: AWS::Region
