name: Vitest shard pilot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/vitest-shard-pilot.yml"

permissions:
  contents: read

jobs:
  vitest-shard-pilot:
    if: >-
      github.repository == 'anantjain-xyz/wallie-dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'experiments/op-140-vitest-shards'
    name: Vitest pilot shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit test shard
        run: pnpm test --shard=${{ matrix.shard }}/2
