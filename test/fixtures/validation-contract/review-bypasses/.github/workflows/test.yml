on:
  pull_request:

jobs:
  test:
    steps:
      - run: pnpm check
        working-directory: packages/nested

  route-budgets:
    if: false
    continue-on-error: true
    steps:
      - if: false
        run: pnpm build
        working-directory: packages/nested
      - continue-on-error: true
        run: pnpm check:route-budgets
